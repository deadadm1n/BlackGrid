name: AetherReach Release

on:
  push:
    tags:
      - "aetherreach-v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
        working-directory: AetherReach

      - name: Build AetherReach
        run: ./gradlew build
        working-directory: AetherReach

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          jar_path="$(find AetherReach/build/libs -maxdepth 1 -type f -name '*.jar' | sort | head -n 1)"
          if [ -z "$jar_path" ]; then
            echo "No jar found in AetherReach/build/libs" >&2
            exit 1
          fi

          version="${TAG_NAME#aetherreach-v}"
          title="AetherReach Core v${version}"
          notes="Automated AetherReach Core build for ${TAG_NAME}."

          if gh release view "$TAG_NAME" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$jar_path#$(basename "$jar_path")" --repo "$REPO" --clobber
          else
            gh release create "$TAG_NAME" "$jar_path#$(basename "$jar_path")" --repo "$REPO" --title "$title" --notes "$notes"
          fi
