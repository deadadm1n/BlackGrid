id: minecraft.neoforge.atm11
name: All the Mods 11
game: minecraft
loader: neoforge
kind: modpack_server
status: first-supported

minecraft:
  version: "1.21.1"
  loader:
    id: neoforge
    display_name: NeoForge
    fallback_loaders:
      - forge
  menu_path:
    - Minecraft
    - NeoForge
    - All the Mods 11

provider:
  type: curseforge_web_api_serverfiles
  project_id: 1148445
  file_list:
    url: "https://www.curseforge.com/api/v1/mods/{project_id}/files"
    page_index: 0
    page_size: 50
    sort: dateCreated
    sort_descending: true
    remove_alphas: true
  additional_files:
    url: "https://www.curseforge.com/api/v1/mods/{project_id}/files/{file_id}/additional-files"
  download:
    url: "https://www.curseforge.com/api/v1/mods/{project_id}/files/{file_id}/download"
  match:
    minecraft_version: "1.21.1"
    server_file_name_contains:
      - ServerFiles
      - Server Files
    loader_priority:
      - NeoForge
      - Forge
  fallback:
    static_manifest: configs/atm11-serverfiles.json
    scrape_page: "https://www.curseforge.com/minecraft/modpacks/all-the-mods-11/files/all"

java:
  required_major: 25

server:
  install_dir: server
  start_script: auto
  stop_command: stop
  startup_timeout_seconds: 1800
  shutdown_timeout_seconds: 180
  default_ports:
    - name: minecraft
      port: 25565
      protocol: tcp
  success_patterns:
    - 'For help, type "help"'
  failure_patterns:
    - 'Failed to start the minecraft server'
    - 'Crash report saved'
    - 'This crash report has been saved'
    - 'A fatal error has been detected'
    - 'FatalStartupException'
    - 'session.lock: already locked'

watchdog:
  detached: true
  plugins:
    atm11_auto_update: true
    auto_restart: false
    minecraft_events: false
    website_status: false

blackgrid_addons:
  offered:
    - id: blackgrid.web_panel
      name: WatchDog web panel
      default: false
      install_phase: config_only
      description: Optional local/secured web UI for controlling this WatchDog instance.
    - id: blackgrid.discord_bot
      name: Discord bot bridge
      default: false
      install_phase: config_only
      description: Optional Discord control/notification bridge. Stripped from the base install unless selected.
    - id: blackgrid.minecraft_helper
      name: BlackGrid Minecraft helper mod
      default: false
      install_phase: mod_download
      loaders:
        - neoforge
      description: Optional in-game helper mod. Stripped from the base install unless selected.
  stripped_by_default:
    - blackgrid.discord_bot
    - blackgrid.minecraft_helper

notes:
  - This recipe documents the current no-key CurseForge web API path.
  - Minecraft recipes now sit under game -> loader -> server/modpack so Fabric, Vanilla, Forge, NeoForge, Paper, and others can be offered cleanly.
  - BlackGrid addons are optional overlays, not part of the base server recipe.
  - BlackGrid should try the provider first, then fall back to the checked-in manifest if CurseForge changes or blocks the endpoint.
  - After setup, WatchDog owns that one server and BlackGrid does not need to keep running.
